[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voidrun"
version = "0.0.7"
description = "Python SDK for VoidRun AI Sandbox"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "VoidRun Team", email = "support@voidrun.io" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
]
dependencies = [
    "pydantic>=2.0.0",
    "urllib3>=2.0.0",
    "certifi",
    "python-dateutil>=2.8.2",
    "websockets>=11.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://voidrun.io"
Documentation = "https://docs.voidrun.io"
Repository = "https://github.com/voidrun/py-sdk"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/examples",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["voidrun"]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
all-examples = "bash scripts/run_all_examples.sh"
